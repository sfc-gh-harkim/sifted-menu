name: Scrape & Deploy

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron is best-effort and often silently drops scheduled
    # jobs (especially on Mondays). Spread redundant weekday slots at off-
    # minute marks so at least one run fires each week. The scrape is
    # idempotent — extra runs just refresh the same week's data.
    - cron: "17 14 * * 1"   # Mon 07:17 PDT — primary
    - cron: "37 15 * * 1"   # Mon 08:37 PDT — backup
    - cron: "23 14 * * 2"   # Tue 07:23 PDT — catch-up if Mon dropped
    - cron: "17 14 * * 3"   # Wed 07:17 PDT — mid-week refresh
    - cron: "41 14 * * 4"   # Thu 07:41 PDT — catch-up
    - cron: "19 15 * * 5"   # Fri 08:19 PDT — end-of-week safety net
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Scrape Sifted menus
        run: npm run scrape

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          mkdir -p _site/data
          cp data/menu.json _site/data/menu.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
