name: Scrape & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Refresh once a week on Monday morning. 14:17 UTC ≈ 07:17 PDT / 06:17 PST.
    # GitHub Actions cron jobs are best-effort and occasionally get silently
    # dropped during cron contention, so we schedule three redundant slots
    # spread across the morning. The scrape+deploy is idempotent — re-runs
    # just overwrite the same data/menu.json with the latest scrape — so
    # extra runs are harmless. The Wednesday slot also catches the rare
    # case where Sifted publishes the new week late on Monday.
    - cron: "17 14 * * 1"   # Monday  07:17 PDT
    - cron: "37 15 * * 1"   # Monday  08:37 PDT
    - cron: "17 14 * * 3"   # Wednesday 07:17 PDT (catch-up)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Scrape Sifted menus
        run: npm run scrape

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          mkdir -p _site/data
          cp data/menu.json _site/data/menu.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
