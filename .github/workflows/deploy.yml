name: Scrape & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Refresh every weekday morning at 13:00 UTC (06:00 PT) so the menu is
    # current before folks head to lunch.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Scrape Sifted menus
        run: npm run scrape

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          mkdir -p _site/data
          cp data/menu.json _site/data/menu.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
