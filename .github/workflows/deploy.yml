name: Scrape & Deploy

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron is best-effort: jobs often start 1–3 hours late during
    # weekday peak load (we've seen 07:17 PDT slots land ~10:00). Schedule ~3h
    # earlier than the desired finish time so breakfast (ends 9:30) still gets
    # fresh data. Off-minute marks reduce collision with other repos' :00 jobs.
    # All times below are PDT (UTC−7); PST runs an hour earlier locally.
    - cron: "23 10 * * 1-5"  # ~03:23 PDT — early primary
    - cron: "17 11 * * 1-5"  # ~04:17 PDT — backup
    - cron: "43 12 * * 1-5"  # ~05:43 PDT — safety net before breakfast
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Scrape Sifted menus
        run: npm run scrape

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          mkdir -p _site/data
          cp data/menu.json _site/data/menu.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
