<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snowflake x Sifted Bellevue</title>
    <meta
      name="description"
      content="A daily-first view of the Sifted weekly menu for the Snowflake Bellevue office."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,600;1,400&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (function () {
        var stored = localStorage.getItem("sifted-menu-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <button
      type="button"
      class="theme-toggle"
      id="theme-toggle"
      aria-label="Switch to dark mode"
      title="Toggle dark mode"
    >
      <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">&#9790;</span>
      <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">&#9728;</span>
    </button>
    <header class="masthead">
      <div class="masthead__inner">
        <h1 class="masthead__title">Snowflake <span class="amp">&times;</span> Sifted</h1>
        <p class="masthead__subtitle">Bellevue Office &middot; <span id="week-label">This Week</span></p>
      </div>
    </header>

    <nav class="day-nav" aria-label="Day selector">
      <div class="day-nav__inner" id="day-nav" role="tablist"></div>
    </nav>

    <main class="menu" id="menu">
      <p class="loading">Setting the table&hellip;</p>
    </main>

    <footer class="footer">
      <a class="footer__cta" id="survey-link" href="#" target="_blank" rel="noopener">
        Share feedback with Sifted
      </a>
      <p class="footer__meta">
        Menu refreshed
        <time id="generated-at"></time>
        &middot; sourced from
        <a href="https://eat.sifted.co" target="_blank" rel="noopener">eat.sifted.co</a>
      </p>
      <p class="footer__legal">
        Not affiliated with Sifted. A small love letter to lunch from the
        Snowflake Bellevue office.
      </p>
    </footer>

    <script src="./app.js" type="module"></script>
  </body>
</html>
